[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-juridico-colombia"
version = "0.1.0"
description = "Extractores conservadores de novedades jurídicas oficiales colombianas"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
pdf = ["pypdf>=5.0"]

[project.scripts]
monitor-juridico = "monitor_juridico.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
